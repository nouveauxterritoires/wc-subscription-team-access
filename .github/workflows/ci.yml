name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Lint PHP
        run: composer lint
      - name: Unit tests
        run: composer test

  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y gettext
      - name: Every string of the POT is translated in French
        run: python3 bin/build-fr.py
      - name: The French catalogue compiles
        run: msgfmt --check -o /tmp/fr.mo languages/wc-subscription-team-access-fr_FR.po
